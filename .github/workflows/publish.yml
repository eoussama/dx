name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry:
        description: Where do you want to publish?
        type: choice
        options: [npm, github, both]
        default: both

permissions:
  contents: read

jobs:
  npm:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.registry != 'github')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance attestations.
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup PNPM
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        registry-url: "https://registry.npmjs.org/"

    # Trusted publishing needs npm >= 11.5.1.
    - name: Update npm
      run: npm install -g npm@latest

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm typecheck

    - name: Test
      run: pnpm test

    - name: Publish Package
      run: npm publish --provenance --access public

  github:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.registry != 'npm')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup PNPM
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        registry-url: "https://npm.pkg.github.com"

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Publish Package
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
